name: Sync Steam data

# 每天从 Steam 拉一次游戏时长、成就和封面，写进 src/data/steam.json。
# 有变化才提交，然后触发一次部署。需要在仓库 Settings → Secrets and variables → Actions
# 里添加 STEAM_API_KEY（没有也能跑，只是只能更新封面和名字）。
on:
  schedule:
    - cron: '17 20 * * *' # 每天北京时间 04:17
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: steam-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch from Steam
        run: node scripts/steam-sync.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ vars.STEAM_ID }}
      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/steam.json && [ -z "$(git ls-files --others --exclude-standard src/data/steam.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/steam.json
          git commit -m "Sync Steam data"
          git push
          # 用 GITHUB_TOKEN 推送不会触发其他 workflow，这里手动触发部署
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
