<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扩散模型的前向加噪过程</title>
<meta name="description" content="二维玩具数据在 x_t = √ᾱ_t x_0 + √(1−ᾱ_t) ε 下逐步变成标准高斯；可切换线性与余弦噪声调度。">
<meta name="viz:date" content="2026-11-01">
<meta name="viz:tags" content="扩散模型">
<style>
  :root { --bg:#fcfcfa; --fg:#23221f; --muted:#85827b; --grid:#e5e3dd; --a:#2f5d8a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#17181b; --fg:#dddad3; --muted:#85837d; --grid:#2d2e33; --a:#8db4dc; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#17181b; --fg:#dddad3; --muted:#85837d; --grid:#2d2e33; --a:#8db4dc; color-scheme: dark; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { padding:16px 20px; max-width:880px; margin:0 auto; display:grid; grid-template-columns: minmax(0,1fr) 220px; gap:20px; align-items:center; }
  canvas { width:100%; aspect-ratio: 1.6; display:block; }
  .side { font-size:14px; color:var(--muted); display:flex; flex-direction:column; gap:10px; }
  input[type=range] { width:100%; accent-color:var(--a); }
  b { color:var(--fg); font-variant-numeric:tabular-nums; font-weight:600; }
  select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--grid); border-radius:4px; padding:2px 6px; }
  @media (max-width: 560px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="side">
    <label>时间步 t = <b id="tv"></b> / 1000<input id="t" type="range" min="0" max="1000" value="0"></label>
    <label>噪声调度 <select id="s"><option value="linear">线性 β</option><option value="cosine">余弦</option></select></label>
    <div>√ᾱ<sub>t</sub> = <b id="sa"></b></div>
    <div>√(1−ᾱ<sub>t</sub>) = <b id="sn"></b></div>
  </div>
</div>
<script>
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const tEl = document.getElementById('t'), sEl = document.getElementById('s');
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  // 固定随机种子，拖动时点不跳
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const gauss = () => Math.sqrt(-2*Math.log(rnd()+1e-12)) * Math.cos(2*Math.PI*rnd());
  const M = 900, x0 = [], eps = [];
  for (let i = 0; i < M; i++) {
    const a = rnd() * Math.PI, up = i % 2 === 0;
    const x = up ? Math.cos(a) : 1 - Math.cos(a), y = up ? Math.sin(a) : 0.5 - Math.sin(a);
    x0.push([(x - 0.5) * 1.6 + gauss()*0.06, (y - 0.25) * 1.6 + gauss()*0.06]);
    eps.push([gauss(), gauss()]);
  }
  const T = 1000;
  const abar = { linear: [], cosine: [] };
  { let p = 1; for (let t = 0; t <= T; t++) { const b = 1e-4 + (0.02 - 1e-4) * t / T; if (t) p *= 1 - b; abar.linear.push(p); } }
  { const f = (t) => Math.cos((t/T + 0.008)/1.008 * Math.PI/2) ** 2; for (let t = 0; t <= T; t++) abar.cosine.push(f(t)/f(0)); }
  function draw() {
    const t = +tEl.value, ab = abar[sEl.value][t], sa = Math.sqrt(ab), sn = Math.sqrt(1 - ab);
    const dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
    c.width = W*dpr; c.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const s = H / 7, X = (x) => W/2 + x*s, Y = (y) => H/2 - y*s;
    ctx.strokeStyle = css('--grid'); ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
    ctx.beginPath(); ctx.arc(W/2, H/2, 2*s, 0, 2*Math.PI); ctx.setLineDash([3,4]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = css('--a'); ctx.globalAlpha = 0.6;
    for (let i = 0; i < M; i++) { const x = sa*x0[i][0] + sn*eps[i][0], y = sa*x0[i][1] + sn*eps[i][1]; ctx.fillRect(X(x)-1.3, Y(y)-1.3, 2.6, 2.6); }
    ctx.globalAlpha = 1;
    document.getElementById('tv').textContent = t;
    document.getElementById('sa').textContent = sa.toFixed(3);
    document.getElementById('sn').textContent = sn.toFixed(3);
  }
  tEl.addEventListener('input', draw); sEl.addEventListener('change', draw); addEventListener('resize', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  draw();
</script>
</body>
</html>
